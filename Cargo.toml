[workspace]
members = [
    "apps/desktop",
    "apps/sync-server",
    "crates/dragonforge-crypto",
    "crates/dragonforge-vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
