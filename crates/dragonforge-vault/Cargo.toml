[package]
name = "dragonforge-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Local encrypted vault core for DragonForge Password Manager"

[dependencies]
dragonforge-crypto = { path = "../dragonforge-crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
