[package]
name = "dragonforge-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Cryptographic foundation for DragonForge Password Manager"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
hkdf = "0.12.4"
ml-dsa = { version = "0.1.1", features = ["alloc", "getrandom", "zeroize"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
rand_core = { version = "0.10.1", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.8"
subtle = "2.6.1"
thiserror = "2.0"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
