name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dragonforge-rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        continue-on-error: true
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Desktop and browser JavaScript syntax
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/browser-extension/src/core.js
          node --check apps/browser-extension/src/background.js
          node --check apps/browser-extension/ui/popup.js

      - name: Browser extension tests
        run: node --test apps/browser-extension/tests/core.test.mjs apps/browser-extension/tests/manifest.test.mjs

      - name: Debug workspace tests
        run: cargo test --workspace --all-features

      - name: Phase 11 protected-sidecar unit tests
        run: cargo test -p dragonforge-desktop --lib sync::tests::protected_v3_disk_config_omits_sync_secrets

      - name: Phase 10 recovery server tests
        run: cargo test -p dragonforge-sync-server --test account_recovery -- --nocapture

      - name: Phase 10 desktop recovery tests
        run: cargo test -p dragonforge-desktop --test account_recovery -- --nocapture

      - name: Phase 9 device enrollment tests
        run: cargo test -p dragonforge-sync-server --test device_enrollment -- --nocapture

      - name: Phase 8 multi-device sync tests
        run: cargo test -p dragonforge-desktop --test multi_device_sync -- --nocapture

      - name: Phase 7 sync server API tests
        run: cargo test -p dragonforge-sync-server --test sync_api -- --nocapture

      - name: Phase 4 hardening tests serially
        run: cargo test -p dragonforge-vault --test hardening -- --test-threads=1

      - name: Release workspace tests
        run: cargo test --workspace --all-features --release

      - name: Desktop release build
        run: cargo build -p dragonforge-desktop --release --bin dragonforge-desktop

      - name: Native host release build
        run: cargo build -p dragonforge-desktop --release --bin dragonforge-native-host

      - name: Sync server release build
        run: cargo build -p dragonforge-sync-server --features postgres --release

  windows-desktop:
    name: Windows desktop build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check PowerShell browser scripts
        shell: powershell
        run: |
          $files = @(
            'scripts/install-browser-native-host.ps1',
            'scripts/uninstall-browser-native-host.ps1',
            'scripts/test-browser-native-host.ps1',
            'scripts/run-phase6-tests.ps1',
            'scripts/run-phase7-tests.ps1',
            'scripts/run-phase8-tests.ps1',
            'scripts/run-phase9-tests.ps1',
            'scripts/run-phase10-tests.ps1',
            'scripts/run-phase11-tests.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($errorItem in $errors) {
                Write-Error ("{0}: {1}" -f $file, $errorItem.Message)
              }
              exit 1
            }
          }

      - name: Check desktop crate
        run: cargo check -p dragonforge-desktop --all-targets

      - name: Check sync server with PostgreSQL
        run: cargo check -p dragonforge-sync-server --features postgres --all-targets

      - name: Run sync server API tests
        run: cargo test -p dragonforge-sync-server --test sync_api -- --nocapture

      - name: Run Phase 11 Windows credential protection test
        run: cargo test -p dragonforge-desktop --test secret_storage -- --nocapture

      - name: Run Phase 10 recovery server tests
        run: cargo test -p dragonforge-sync-server --test account_recovery -- --nocapture

      - name: Run Phase 10 desktop recovery tests
        run: cargo test -p dragonforge-desktop --test account_recovery -- --nocapture

      - name: Run Phase 9 device enrollment tests
        run: cargo test -p dragonforge-sync-server --test device_enrollment -- --nocapture

      - name: Run Phase 8 multi-device sync tests
        run: cargo test -p dragonforge-desktop --test multi_device_sync -- --nocapture

      - name: Run desktop service tests
        run: cargo test -p dragonforge-desktop --test desktop_service -- --nocapture

      - name: Build Windows desktop release
        run: cargo build -p dragonforge-desktop --release --bin dragonforge-desktop

      - name: Build Windows native messaging host
        run: cargo build -p dragonforge-desktop --release --bin dragonforge-native-host

      - name: Build Windows sync server
        run: cargo build -p dragonforge-sync-server --features postgres --release
