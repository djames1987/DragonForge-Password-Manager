<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">DragonForge Password Manager</title><desc id="desc">A dark geometric banner showing a native encrypted vault, browser integration, and opaque encrypted synchronization.</desc><rect width="1200" height="300" rx="28" fill="#090b10"/><rect x="22" y="22" width="1156" height="256" rx="22" fill="#11141b" stroke="#202632" stroke-width="2"/><rect x="90" y="72" width="80" height="100" rx="15" fill="none" stroke="#ff8a2b" stroke-width="8"/><path d="M108 72 V56 C108 27 152 27 152 56 V72" fill="none" stroke="#ff8a2b" stroke-width="8"/><circle cx="130" cy="119" r="8" fill="#ff8a2b"/><text x="220" y="102" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">DragonForge Password Manager</text><text x="220" y="144" fill="#8d96a8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Historical standalone baseline • native vault boundary • zero-knowledge sync</text><rect x="220" y="181" width="190" height="48" rx="10" fill="#171b24" stroke="#ff8a2b"/><text x="315" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Native Vault</text><path d="M410 205 H500" stroke="#8d96a8" stroke-width="3"/><rect x="500" y="181" width="190" height="48" rx="10" fill="#171b24"/><text x="595" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Browser Bridge</text><path d="M690 205 H780" stroke="#8d96a8" stroke-width="3"/><rect x="780" y="181" width="250" height="48" rx="10" fill="#171b24"/><text x="905" y="211" text-anchor="middle" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Opaque Encrypted Sync</text></svg>