<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">DragonForge Password Manager</title>
<desc id="desc">Security-first zero-knowledge password manager with post-quantum cryptography, browser fill, multi-device sync, device trust, recovery, and Windows credential protection.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.55" stop-color="#111a31"/>
    <stop offset="1" stop-color="#1b1230"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff7a18"/>
    <stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1400" height="560" rx="28" fill="url(#bg)"/>
<circle cx="1220" cy="105" r="180" fill="#7b2cbf" opacity=".10"/>
<circle cx="1120" cy="470" r="220" fill="#ff7a18" opacity=".08"/>
<g filter="url(#shadow)">
  <rect x="70" y="70" width="1260" height="420" rx="26" fill="#111827" stroke="#29344f"/>
</g>
<g transform="translate(110 116)">
  <path d="M54 10 98 30v44c0 34-22 64-44 76C32 138 10 108 10 74V30Z" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <path d="M54 42c19 0 34 15 34 34 0 14-8 26-20 31v20H40v-20c-12-5-20-17-20-31 0-19 15-34 34-34Z" fill="#ff8c32"/>
  <circle cx="54" cy="75" r="9" fill="#111827"/>
</g>
<text x="245" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="#f8fafc">DragonForge Password Manager</text>
<text x="245" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">Security-first • Zero-knowledge • Post-quantum-aware • Rust-native</text>
<text x="110" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e2e8f0">A local-first encrypted vault with browser autofill, authenticated multi-device sync,</text>
<text x="110" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e2e8f0">device enrollment and revocation, disaster recovery, and OS-backed secret protection.</text>
<g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
  <rect x="110" y="376" width="210" height="50" rx="25" fill="#1e293b" stroke="#334155"/>
  <text x="215" y="408" text-anchor="middle" fill="#f8fafc">AES-256-GCM</text>
  <rect x="340" y="376" width="190" height="50" rx="25" fill="#1e293b" stroke="#334155"/>
  <text x="435" y="408" text-anchor="middle" fill="#f8fafc">Argon2id</text>
  <rect x="550" y="376" width="220" height="50" rx="25" fill="#1e293b" stroke="#334155"/>
  <text x="660" y="408" text-anchor="middle" fill="#f8fafc">ML-DSA-65</text>
  <rect x="790" y="376" width="230" height="50" rx="25" fill="#1e293b" stroke="#334155"/>
  <text x="905" y="408" text-anchor="middle" fill="#f8fafc">ML-KEM-768</text>
  <rect x="1040" y="376" width="220" height="50" rx="25" fill="url(#accent)"/>
  <text x="1150" y="408" text-anchor="middle" fill="#111827">Phase 11</text>
</g>
</svg>