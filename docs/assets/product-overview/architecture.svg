<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">DragonForge zero-knowledge architecture</title>
<desc id="desc">Desktop vault and browser bridge keep plaintext local while the sync server stores only opaque encrypted vault bytes and metadata.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151c2d"/><stop offset="1" stop-color="#0f1524"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff7a18"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1400" height="900" rx="28" fill="#090e19"/>
<text x="70" y="76" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#f8fafc">Zero-knowledge architecture</text>
<text x="70" y="112" font-family="Segoe UI, Arial" font-size="20" fill="#94a3b8">Plaintext secrets stay on the trusted desktop boundary.</text>

<rect x="70" y="160" width="600" height="620" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
<text x="105" y="210" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#ff9a45">Trusted local device</text>

<rect x="110" y="250" width="520" height="120" rx="18" fill="#0f172a" stroke="#475569"/>
<text x="145" y="292" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#f8fafc">Desktop vault</text>
<text x="145" y="327" font-family="Segoe UI, Arial" font-size="18" fill="#cbd5e1">Master password + Account Secret → unlock key → wrapped VMK</text>
<text x="145" y="355" font-family="Segoe UI, Arial" font-size="18" fill="#cbd5e1">Item titles, usernames, passwords, URLs, notes and tags encrypted</text>

<rect x="110" y="400" width="245" height="140" rx="18" fill="#0f172a" stroke="#475569"/>
<text x="140" y="440" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#f8fafc">Browser extension</text>
<text x="140" y="475" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Site-scoped summaries</text>
<text x="140" y="503" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Explicit Fill action</text>
<text x="140" y="531" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">No auto-submit</text>

<rect x="385" y="400" width="245" height="140" rx="18" fill="#0f172a" stroke="#475569"/>
<text x="415" y="440" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#f8fafc">Native bridge</text>
<text x="415" y="475" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Native messaging</text>
<text x="415" y="503" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Fresh 256-bit token</text>
<text x="415" y="531" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Origin allowlisting</text>

<rect x="110" y="575" width="520" height="150" rx="18" fill="#0f172a" stroke="#475569"/>
<text x="145" y="616" font-family="Segoe UI, Arial" font-size="21" font-weight="700" fill="#f8fafc">Windows local credential protection</text>
<text x="145" y="651" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Windows Credential Manager: sync token + ML-DSA device seed</text>
<text x="145" y="679" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Sidecar v3 keeps only non-secret sync metadata + credential reference</text>
<text x="145" y="707" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Legacy sidecars migrate fail-closed</text>

<rect x="790" y="250" width="540" height="475" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
<text x="825" y="300" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#60a5fa">Zero-knowledge sync server</text>
<rect x="835" y="340" width="450" height="100" rx="16" fill="#0f172a" stroke="#475569"/>
<text x="865" y="380" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#f8fafc">Opaque encrypted .dfvault bytes</text>
<text x="865" y="412" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">64 MiB max • SHA-256 blob fingerprint • monotonic revision</text>

<rect x="835" y="470" width="450" height="100" rx="16" fill="#0f172a" stroke="#475569"/>
<text x="865" y="510" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#f8fafc">Device trust metadata</text>
<text x="865" y="542" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">UUID • name • ML-DSA verifying key • pending/active/revoked</text>

<rect x="835" y="600" width="450" height="100" rx="16" fill="#0f172a" stroke="#475569"/>
<text x="865" y="640" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#f8fafc">Recovery metadata</text>
<text x="865" y="672" font-family="Segoe UI, Arial" font-size="17" fill="#cbd5e1">Recovery verifying key • encrypted Account Secret envelope • generation</text>

<path d="M670 420 C720 420 740 390 790 390" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M790 520 C740 520 720 560 670 560" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="660" y="780" width="680" height="70" rx="20" fill="#111827" stroke="#334155"/>
<text x="1000" y="810" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#f8fafc">Never intentionally stored by sync server</text>
<text x="1000" y="838" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#fca5a5">Master password • Account Secret plaintext • VMK • item plaintext • private device/recovery seeds</text>
</svg>