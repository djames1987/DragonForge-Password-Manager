[package]
name = "dragonforge-sync-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Zero-knowledge sync server foundation for DragonForge Password Manager"

[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "http1"] }
dragonforge-crypto = { path = "../../crates/dragonforge-crypto" }
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
