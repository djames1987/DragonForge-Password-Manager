[package]
name = "dragonforge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
build = "build.rs"
description = "DragonForge Password Manager desktop application"

[lib]
name = "dragonforge_desktop"
crate-type = ["rlib"]

[[bin]]
name = "dragonforge-desktop"
path = "src/main.rs"

[dependencies]
dragonforge-vault = { path = "../../crates/dragonforge-vault" }
hex = "0.4.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
zeroize = "1.8"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
